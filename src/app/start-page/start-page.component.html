<div class="start-container">
  <!-- IFM Branding -->
  <div class="logo-icon-top logo-icon-left">🏭</div>
  <div class="logo-icon-top logo-icon-right">⚙️</div>

  <!-- Top 3 Leaderboard -->
  <section class="top-scores" *ngIf="topScores.length > 0">
    <h3 class="top-scores-title">🏆 TOP PERFORMER</h3>
    <div class="top-scores-list">
      <div class="score-item" *ngFor="let entry of topScores; let i = index">
        <span class="rank">{{ i + 1 }}</span>
        <span class="player-name">{{ entry.username }}</span>
        <span class="score">{{ entry.points }} Punkte</span>
      </div>
    </div>
  </section>

  <!-- Hero Section - Game Title -->
  <header class="hero">
    <h1>PRODUCTION RUNNER</h1>
    <p class="subtitle">IFM AUTOMATION CHALLENGE</p>
  </header>

  <!-- Game Modes Section -->
  <section class="modes-section">
    <div class="modes-grid">
      <!-- Classic Mode -->
      <div class="mode-card" [class.selected]="selectedMode === 'classic'" (click)="selectMode('classic')">
        <div class="mode-icon">▶️</div>
        <h3>Classic Mode</h3>
      </div>

      <!-- Practice Mode -->
      <div class="mode-card" [class.selected]="selectedMode === 'practice'" (click)="selectMode('practice')">
        <div class="mode-icon">🏋️</div>
        <h3>Trainings-Modus</h3>
      </div>
    </div>
  </section>

  <!-- Start Button -->
  <button class="start-button" (click)="startGame()">
    <span class="play-icon">▶</span>
    SPIEL STARTEN
  </button>
</div>
