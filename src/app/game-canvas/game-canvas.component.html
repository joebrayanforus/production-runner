
<div class="game-container">
  <div class="arcade-cabinet">
    <div class="arcade-screen-frame">
      <div class="game-info-bar">
        <div class="player-badge">
          <span class="player-icon">🎮</span>
          <span class="player-name-display">{{ playerName || 'PLAYER 1' }}</span>
        </div>
        <div class="game-mode-badge">
          <span class="mode-label">MODE:</span>
          <span class="mode-value">{{ gameMode.toUpperCase() }}</span>
        </div>
      </div>
      <canvas #gameCanvas></canvas>
      <div class="scanline-overlay"></div>

      <!-- Game Over Overlay -->
      <div class="overlay" *ngIf="gameState === 'gameover'">
        <div class="overlay-panel">
          <h2>GAME OVER</h2>
          <p>Score: {{ score }}</p>
          <div class="overlay-actions">
            <button class="btn primary" (click)="restartGame()">Restart</button>
            <button class="btn ghost" (click)="exitGame()">Quitter le jeu</button>
          </div>
          <p class="overlay-hint">(A) pour rejouer • (Start/Menu) pour quitter</p>
        </div>
      </div>
    </div>
  </div>
</div>
