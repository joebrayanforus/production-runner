<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot body -->
  <rect x="4" y="6" width="18" height="20" fill="#ED6B00" stroke="#FF8800" stroke-width="1.5"/>
  <rect x="5" y="7" width="16" height="18" fill="#FF8800" opacity="0.3"/>

  <!-- Head (pointing right) -->
  <rect x="20" y="10" width="8" height="12" fill="#FF8800" stroke="#FFD700" stroke-width="1"/>

  <!-- Eyes (sensors) - glowing green -->
  <circle cx="25" cy="13" r="2" fill="#00FF88"/>
  <circle cx="25" cy="13" r="1.2" fill="#00FFAA"/>
  <circle cx="25" cy="19" r="2" fill="#00FF88"/>
  <circle cx="25" cy="19" r="1.2" fill="#00FFAA"/>

  <!-- ifm logo indicator -->
  <circle cx="13" cy="16" r="2.5" fill="#00FF88" opacity="0.8"/>
  <circle cx="13" cy="16" r="1.5" fill="#FFFFFF"/>

  <!-- Body details -->
  <rect x="16" y="8" width="3" height="3" fill="#FFD700" opacity="0.4"/>
  <rect x="16" y="21" width="3" height="3" fill="#FFD700" opacity="0.4"/>

  <!-- Glow effect -->
  <rect x="3" y="5" width="20" height="22" fill="none" stroke="#ED6B00" stroke-width="0.5" opacity="0.3"/>
</svg>
