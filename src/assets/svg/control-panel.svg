<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Control panel -->
  <rect x="2" y="2" width="28" height="28" fill="#374151" stroke="#1f2937" stroke-width="2"/>
  <rect x="4" y="4" width="24" height="24" fill="#4b5563"/>

  <!-- Screen -->
  <rect x="6" y="6" width="20" height="12" fill="#00FF88" opacity="0.3"/>
  <rect x="7" y="7" width="18" height="10" fill="#1a1a2e"/>

  <!-- Display lines -->
  <line x1="8" y1="9" x2="23" y2="9" stroke="#00FF88" stroke-width="1"/>
  <line x1="8" y1="11" x2="20" y2="11" stroke="#00FF88" stroke-width="1"/>
  <line x1="8" y1="13" x2="18" y2="13" stroke="#00FF88" stroke-width="1"/>
  <line x1="8" y1="15" x2="22" y2="15" stroke="#00FF88" stroke-width="1"/>

  <!-- Buttons -->
  <circle cx="10" cy="22" r="2" fill="#FF3333"/>
  <circle cx="16" cy="22" r="2" fill="#FFD700"/>
  <circle cx="22" cy="22" r="2" fill="#00FF88"/>

  <!-- Button lights -->
  <circle cx="10" cy="22" r="1" fill="#FF6666" opacity="0.8"/>
  <circle cx="16" cy="22" r="1" fill="#FFFF00" opacity="0.8"/>
  <circle cx="22" cy="22" r="1" fill="#00FFAA" opacity="0.8"/>
</svg>
