<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- IoT sensor bonus -->
  <rect x="4" y="4" width="16" height="16" rx="2" fill="#00FFFF" stroke="#00CCCC" stroke-width="2"/>
  <rect x="6" y="6" width="12" height="12" fill="#00AAAA"/>

  <!-- Antenna -->
  <line x1="12" y1="4" x2="12" y2="0" stroke="#00FFFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="12" cy="0" r="2" fill="#00FFFF"/>

  <!-- Signal waves -->
  <path d="M 8 8 Q 6 12 8 16" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M 16 8 Q 18 12 16 16" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Center LED -->
  <circle cx="12" cy="12" r="3" fill="#FFFFFF"/>
  <circle cx="12" cy="12" r="2" fill="#00FFFF"/>

  <!-- Glow effect -->
  <circle cx="12" cy="12" r="11" fill="none" stroke="#00FFFF" stroke-width="1" opacity="0.3"/>
</svg>
