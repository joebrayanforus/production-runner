<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Temperature malfunction - RED theme -->

  <!-- Wavy body (ghost-like) -->
  <path d="M 8 16 Q 8 10 12 8 T 20 8 T 24 16 L 24 26 Q 23 24 22 26 Q 21 24 20 26 Q 19 24 18 26 Q 17 24 16 26 Q 15 24 14 26 Q 13 24 12 26 Q 11 24 10 26 L 10 16 Z"
        fill="#FF3333" stroke="#FF0000" stroke-width="1.5"/>

  <!-- Inner gradient effect -->
  <path d="M 10 16 Q 10 12 14 10 T 18 10 T 22 16 L 22 24 Q 21 23 20 24 Q 19 23 18 24 Q 17 23 16 24 Q 15 23 14 24 Q 13 23 12 24 L 12 16 Z"
        fill="#FF6666" opacity="0.6"/>

  <!-- Eyes - angry/alert -->
  <ellipse cx="13" cy="14" rx="2.5" ry="3" fill="#FFFFFF"/>
  <ellipse cx="19" cy="14" rx="2.5" ry="3" fill="#FFFFFF"/>
  <circle cx="13" cy="15" r="1.5" fill="#000000"/>
  <circle cx="19" cy="15" r="1.5" fill="#000000"/>

  <!-- Temperature symbol (thermometer) -->
  <rect x="15" y="18" width="2" height="5" fill="#FFFFFF" rx="1"/>
  <circle cx="16" cy="24" r="2" fill="#FFFFFF"/>
  <rect x="15.5" y="20" width="1" height="3" fill="#FF0000"/>

  <!-- Danger glow -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#FF3333" stroke-width="0.5" opacity="0.3"/>
</svg>
