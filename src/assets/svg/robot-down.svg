<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot body -->
  <rect x="6" y="4" width="20" height="18" fill="#ED6B00" stroke="#FF8800" stroke-width="1.5"/>
  <rect x="7" y="5" width="18" height="16" fill="#FF8800" opacity="0.3"/>

  <!-- Head (pointing down) -->
  <rect x="10" y="20" width="12" height="8" fill="#FF8800" stroke="#FFD700" stroke-width="1"/>

  <!-- Eyes (sensors) - glowing green -->
  <circle cx="13" cy="25" r="2" fill="#00FF88"/>
  <circle cx="13" cy="25" r="1.2" fill="#00FFAA"/>
  <circle cx="19" cy="25" r="2" fill="#00FF88"/>
  <circle cx="19" cy="25" r="1.2" fill="#00FFAA"/>

  <!-- ifm logo indicator -->
  <circle cx="16" cy="13" r="2.5" fill="#00FF88" opacity="0.8"/>
  <circle cx="16" cy="13" r="1.5" fill="#FFFFFF"/>

  <!-- Body details -->
  <rect x="8" y="16" width="3" height="3" fill="#FFD700" opacity="0.4"/>
  <rect x="21" y="16" width="3" height="3" fill="#FFD700" opacity="0.4"/>

  <!-- Glow effect -->
  <rect x="5" y="3" width="22" height="20" fill="none" stroke="#ED6B00" stroke-width="0.5" opacity="0.3"/>
</svg>
