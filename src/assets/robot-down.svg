<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot body (square with ifm orange) -->
  <rect x="4" y="2" width="12" height="12" fill="#ED6B00" stroke="#1a1a1a" stroke-width="1" rx="1"/>

  <!-- Robot head (smaller square) -->
  <rect x="7" y="12" width="6" height="6" fill="#ED6B00" stroke="#1a1a1a" stroke-width="1" rx="1"/>

  <!-- Eyes (sensors) -->
  <circle cx="9" cy="14" r="1" fill="#1a1a1a"/>
  <circle cx="11" cy="14" r="1" fill="#1a1a1a"/>

  <!-- Antenna (direction indicator pointing down) -->
  <line x1="10" y1="18" x2="10" y2="20" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="10" cy="19.5" r="0.5" fill="#FFD700"/>

  <!-- Body details (sensor panels) -->
  <rect x="6" y="4" width="2" height="2" fill="#1a1a1a" opacity="0.3"/>
  <rect x="12" y="4" width="2" height="2" fill="#1a1a1a" opacity="0.3"/>
  <rect x="6" y="8" width="2" height="2" fill="#1a1a1a" opacity="0.3"/>
  <rect x="12" y="8" width="2" height="2" fill="#1a1a1a" opacity="0.3"/>

  <!-- Central ifm logo indicator -->
  <circle cx="10" cy="8" r="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.5"/>
  <text x="10" y="9" text-anchor="middle" font-family="Arial" font-size="3" fill="#ED6B00" font-weight="bold">ifm</text>
</svg>
