<div class="player-card">
  <header class="idplayer">
    <h2>Player: {{name}}</h2>
    <p>Score: {{punktestand}}</p>
  </header>
  <div class="grid">
    <div *ngFor="let row of [].constructor(rows); let x=index" class="grid-row">
      <div *ngFor="let col of [].constructor(cols); let y = index" class="cells">
        {{x === posX && y === posY ? '🤖' : '.'}}
      </div>
    </div>
  </div>
  <div class="controls">
    <button (click)="move(-1, 0)">⬆️</button>
    <button (click)="move(1, 0)">⬇️</button>
    <button (click)="move(0, 1)">➡️</button>
    <button (click)="move(0, -1)">⬅️</button>
  </div>

  <div class="actions">
    <div class="action">
      <button (click)="increasescore()">+</button>
    </div>
    <div class="action2">
      <button (click)="decreasescore()">-</button>
    </div>
  </div>
</div>
