services:
  backend:
    build:
      context: ./BackendApi
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"

  frontend:
    build:
      context: .
      dockerfile: ./src/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
  
