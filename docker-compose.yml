services:
  productionrunnerapi:
    build:
      context: ./ProductionRunnerAPI
      dockerfile: Dockerfile
    ports:
      - "5001:80"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"

  frontend:
    build:
      context: .
      dockerfile: ./src/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - productionrunnerapi
  
